services:
  - type: web
    name: skillbattle-api
    runtime: python
    pythonVersion: "3.11"
    
    # Root directory where Render should look for the app
    rootDir: backend
    
    # Build command - install dependencies with upgraded build tools
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    
    # Start command - run migrations using script then start uvicorn
    startCommand: python run_migrations.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    
    # Environment variables (set these in the Render dashboard)
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Regions - Choose the closest one
    region: singapore
    
    # For free tier: instances will sleep after 15 minutes of inactivity
    # Use UptimeRobot to keep it alive
