version: "3.9"
services:
  nginx:
    image: nginx:alpine
    container_name: battleai-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: battleai-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_TYPE=postgresql
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=skillbattle_db
      - POSTGRES_USER=skillbattle
      - POSTGRES_PASSWORD=skillbattle
      - SECRET_KEY=change-me
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: battleai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend

  postgres:
    image: postgres:15
    container_name: battleai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillbattle
      POSTGRES_PASSWORD: skillbattle
      POSTGRES_DB: skillbattle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
