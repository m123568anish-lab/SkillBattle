[pytest]
pythonpath = backend

testpaths =
    backend/tests

norecursedirs =
    .git
    .venv
    backend/.venv
    frontend/.next
    frontend/backend
    scripts
    qc

asyncio_mode = auto

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --tb=short
    --disable-warnings
