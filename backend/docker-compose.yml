version: "3.9"

services:

  api:

    build: .

    container_name: skillbattle_api

    restart: always

    ports:

      - "8000:8000"

    env_file:

      - .env

    depends_on:

      postgres:

        condition: service_healthy

      redis:

        condition: service_started

      ollama:

        condition: service_started

    volumes:

      - .:/app

  postgres:

    image: postgres:16

    container_name: skillbattle_postgres

    restart: always

    environment:

      POSTGRES_DB: skillbattle

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL","pg_isready -U postgres"]

      interval: 10s

      timeout: 5s

      retries: 5

  redis:

    image: redis:7

    container_name: skillbattle_redis

    restart: always

    ports:

      - "6379:6379"

  ollama:

    image: ollama/ollama

    container_name: skillbattle_ollama

    restart: always

    ports:

      - "11434:11434"

    volumes:

      - ollama_data:/root/.ollama

volumes:

  postgres_data:

  ollama_data: