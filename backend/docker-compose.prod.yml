version: "3.9"

services:

  api:

    build:

      context: .

      dockerfile: Dockerfile.prod

    env_file:

      - .env.production

    restart: always

    depends_on:

      - postgres

      - redis

      - ollama

  postgres:

    image: postgres:16

    restart: always

    volumes:

      - postgres:/var/lib/postgresql/data

  redis:

    image: redis:7

    restart: always

  ollama:

    image: ollama/ollama

    restart: always

volumes:

  postgres: