version: "3.9"

services:

  api:

    build:

      context: .

      dockerfile: Dockerfile.prod

    env_file:

      - .env.production

    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/skillbattle
      ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/skillbattle

    restart: always

    depends_on:

      - postgres

      - redis

      - ollama

  postgres:

    image: postgres:16

    environment:
      POSTGRES_DB: skillbattle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    restart: always

    volumes:

      - postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillbattle"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:

    image: redis:7

    restart: always

  ollama:

    image: ollama/ollama

    restart: always

volumes:

  postgres: