name: Compose Smoke Tests

# DISABLED by default - can be triggered manually
# Use: workflow_dispatch to run manual smoke tests
# Automatic docker-compose testing is disabled to prevent CI delays

on:
  workflow_dispatch:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4

      - name: ℹ️  Compose smoke tests are disabled
        run: echo "Use workflow_dispatch to run manual smoke tests"
