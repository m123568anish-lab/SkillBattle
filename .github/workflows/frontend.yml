name: Frontend Build Check

# DISABLED - Use main CI workflow instead
# This workflow is kept for historical purposes
# All frontend checks are now in .github/workflows/ci.yml

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: ⏭️  Frontend CI disabled - using main CI workflow
        run: echo "Frontend checks run in ci.yml workflow"
          fi
