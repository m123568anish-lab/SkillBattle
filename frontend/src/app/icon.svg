<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="q_grad_bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1526" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>
    <linearGradient id="q_grad_ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="q_grad_tail" x1="32" y1="32" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Container with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#q_grad_bg)" />
  <rect width="64" height="64" rx="16" stroke="#06B6D4" stroke-opacity="0.25" stroke-width="1.5" />

