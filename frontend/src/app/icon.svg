  <!-- Core Intelligence Spark / Node -->
  <circle cx="32" cy="30" r="4.5" fill="#22D3EE" />

  <!-- Dynamic Momentum Tail / Chevron -->
  <path d="M38 36L50 48M44 48H50V42" stroke="url(#q_grad_tail)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
